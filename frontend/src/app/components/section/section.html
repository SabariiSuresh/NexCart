<div class="px-4 sm:px-8 py-12 min-h-screen">

    <div class="flex flex-col sm:flex-row justify-between items-center mb-10 gap-4">
        <h2
            class="text-2xl sm:text-3xl md:text-4xl font-serif font-semibold text-gray-900 border-l-4 border-teal-500 pl-3 text-center sm:text-left">
            {{ sectionTitle }}
        </h2>

        <button routerLink="/home"
            class="text-gray-600 hover:text-teal-600 text-sm sm:text-base flex items-center gap-1 transition-all">
            <i class="pi pi-angle-left text-xs"></i>
            <strong>Back to Home</strong>
        </button>
    </div>

    <div
        class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-5 sm:gap-8 pt-3 sm:pt-6">

        <div *ngFor="let product of products" (click)="viewProduct(product._id)"
            class="group relative bg-white rounded-2xl shadow-md hover:shadow-xl transition-all duration-300 overflow-hidden cursor-pointer border border-gray-100">

            <span *ngIf="product.discount > 0"
                class="absolute top-3 left-3 bg-red-500 text-white text-[10px] sm:text-xs font-bold px-2 py-1 rounded-full shadow-md z-10">
                -{{ product.discount }}%
            </span>

            <div class="relative w-full h-40 sm:h-48 md:h-56 flex items-center justify-center">
                <img [src]="product.images[0].startsWith('http') ? product.images[0] :'http://localhost:3000' + product.images[0]" alt="{{ product.name }}"
                    class="h-full object-contain p-3 sm:p-4 transition-transform duration-700 group-hover:scale-110" />
            </div>

            <div class="p-3 sm:p-4 text-center">
                <p
                    class="text-xs sm:text-sm md:text-base font-semibold text-gray-800 truncate group-hover:text-teal-600 transition-colors duration-300">
                    {{ product.name | titlecase }}
                </p>
                <div class="flex justify-center items-baseline gap-2 mt-1">
                    <span class="text-sm sm:text-lg font-bold text-teal-500">
                        {{ product.price | currency:'INR' }}
                    </span>
                    <span *ngIf="product.oldPrice" class="text-[11px] sm:text-sm text-gray-400 line-through">
                        {{ product.oldPrice | currency:'INR' }}
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>
