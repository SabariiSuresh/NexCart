<div class="text-gray-900 min-h-screen  p-3 sm:p-6">

  <div
    class="flex overflow-x-auto gap-5 sm:gap-6 py-5 px-3 sm:px-6 bg-gradient-to-r from-gray-50 via-white to-gray-50 rounded-3xl shadow-inner scrollbar-hide border border-gray-100">

    <div *ngFor="let category of categories" (click)="viewCategory(category._id)"
      class="flex-shrink-0 w-27 h-24 sm:w-35 sm:h-30 bg-white rounded-2xl shadow-sm hover:shadow-xl hover:-translate-y-1 transform transition-all duration-300 cursor-pointer flex flex-col items-center justify-center border border-gray-100 relative group">

      <img *ngIf="category.image"
        [src]="category.image.startsWith('http') ? category.image : 'http://localhost:3000' + category.image"
        alt="{{ category.name }}" class="w-14 h-14 sm:w-22 sm:h-22 object-cover rounded-full border border-gray-200" />

      <span
        class="mt-2 sm:mt-3 text-xs sm:text-sm font-semibold text-gray-700 group-hover:text-teal-600 truncate w-full text-center transition-colors duration-300">
        {{ category.name | titlecase }}
      </span>
    </div>
  </div>


  <div class="w-full flex flex-col lg:flex-row justify-center items-start mt-6 sm:mt-10 px-2 sm:px-4 pt-5 gap-4">
    <div class="w-full lg:w-[60%]">
      <p-carousel [value]="banners" [numVisible]="1" [circular]="true" [autoplayInterval]="3000" styleClass="w-full">
        <ng-template let-banner pTemplate="item">
          <div
            class="relative w-full flex justify-center items-center rounded-3xl overflow-hidden shadow-md bg-gray-100">
            <img [src]="banner.image" alt="banner"
              class="w-full h-[180px] sm:h-[250px] md:h-[300px] lg:h-[350px] xl:h-[400px] object-cover rounded-3xl hover:scale-105 transition-transform duration-500 cursor-pointer" />
          </div>
        </ng-template>
      </p-carousel>
    </div>

    <div class="w-full lg:w-[40%] flex items-center justify-center">
      <img src="assets/offerBanner.jpg" alt="Offer Banner"
        class="w-full h-[180px] sm:h-[250px] md:h-[300px] lg:h-[350px] xl:h-[400px] object-cover rounded-3xl shadow-md hover:scale-105 transition-transform duration-500 cursor-pointer" />
    </div>
  </div>


  <div class="px-4 sm:px-8 py-10 space-y-16">
    <div *ngFor="let section of productSections" class="space-y-8">
      <div class="flex justify-between items-center pb-3">
        <h3
          class="text-2xl sm:text-3xl font-serif font-semibold text-gray-900 border-l-4 border-teal-400 pl-3 tracking-wide">
          {{ section.title }}
        </h3>
        <button
          class="text-teal-500 hover:text-teal-700 font-medium flex items-center gap-1 text-sm sm:text-base cursor-pointer transition-colors duration-300"
          (click)="navigateSections(section.key)">
          View More <i class="pi pi-angle-right text-xs"></i>
        </button>
      </div>

      <div class="flex overflow-x-auto gap-5 sm:gap-8 pb-2 scrollbar-hide snap-x snap-mandatory scroll-smooth">

        <div *ngFor="let product of section.products" (click)="viewCategory(product.category._id)"
          class="snap-start flex-shrink-0 w-44 sm:w-56 md:w-60 bg-white rounded-3xl shadow-md hover:shadow-2xl transition-all duration-500 cursor-pointer group relative overflow-hidden border border-gray-100">

          <span *ngIf="product.discount > 0"
            class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-md">
            -{{ product.discount }}%
          </span>

          <div class="relative w-full h-48 sm:h-56 flex items-center justify-center ">
            <img [src]="'http://localhost:3000' + product.images[0]" alt="{{ product.name }}"
              class="h-full object-contain transition-transform duration-700 group-hover:scale-110 p-3" />
          </div>

          <div class="p-4 text-center">
            <p
              class="text-sm sm:text-base font-semibold text-gray-800 truncate group-hover:text-teal-600 transition-colors duration-300">
              {{ product.name | titlecase }}
            </p>
            <div class="flex justify-center items-baseline gap-2 mt-1">
              <span class="text-lg sm:text-xl font-bold text-teal-500">
                {{ product.price | currency:'INR' }}
              </span>
              <span *ngIf="product.oldPrice" class="text-sm sm:text-base text-gray-400 line-through">
                {{ product.oldPrice | currency:'INR' }}
              </span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
