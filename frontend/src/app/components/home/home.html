<div class="text-gray-900 min-h-screen  p-3 sm:p-6">


  <div *ngIf="categoryLoading" class="flex gap-4 overflow-x-auto py-5 px-3 sm:px-6
            bg-gradient-to-r from-gray-50 via-white to-gray-50
            rounded-3xl shadow-inner border border-gray-100 animate-pulse">

    <div *ngFor="let i of skeletonItems" class="flex flex-col items-center gap-2 flex-shrink-0">

      <p-skeleton shape="circle" size="5.5rem"></p-skeleton>
      <p-skeleton width="5rem" height="0.8rem"></p-skeleton>

    </div>

  </div>

  <div *ngIf="!categoryLoading" class="flex overflow-x-auto sm:justify-center gap-3 sm:gap-6 py-5 px-3 sm:px-6
            bg-gradient-to-r from-gray-50 via-white to-gray-50
            rounded-3xl shadow-inner border border-gray-100">

    <div *ngFor="let category of categories" (click)="viewCategory(category._id)" class="flex-shrink-0 w-24 h-24 sm:w-32 sm:h-28
              bg-white rounded-2xl shadow-sm hover:shadow-xl
              hover:-translate-y-1 transform transition-all duration-300
              cursor-pointer flex flex-col items-center justify-center
              border border-gray-100 relative group">

      <img *ngIf="category.image"
        [src]="category.image.startsWith('http') ? category.image : environment.apiUrl + category.image"
        alt="{{ category.name }}" class="w-14 h-14 sm:w-20 sm:h-20 object-cover rounded-full border border-gray-200" />

      <span class="mt-2 text-xs sm:text-sm font-semibold text-gray-700
                 group-hover:text-teal-600 truncate w-full text-center">
        {{ category.name | titlecase }}
      </span>

    </div>
  </div>

  <div class="w-full flex flex-col lg:flex-row justify-center items-start mt-6 sm:mt-10 px-2 sm:px-4 pt-5 gap-4">
    <div class="w-full lg:w-[60%]">
      <p-carousel [value]="banners" [numVisible]="1" [circular]="true" [autoplayInterval]="3000" styleClass="w-full">
        <ng-template let-banner pTemplate="item">
          <div
            class="relative w-full flex justify-center items-center rounded-3xl overflow-hidden shadow-md bg-gray-100">
            <img [src]="banner.image" alt="banner"
              class="w-full h-[150px] sm:h-[250px] md:h-[300px] lg:h-[350px] xl:h-[400px] object-cover rounded-3xl" />
          </div>
        </ng-template>
      </p-carousel>
    </div>

    <div class="w-full lg:w-[40%] flex items-center justify-center">
      <img src="assets/offerBanner.png" alt="Offer Banner"
        class="w-full h-[155px] sm:h-[250px] md:h-[300px] lg:h-[350px] xl:h-[400px] object-cover rounded-3xl shadow-md" />
    </div>
  </div>

  <div *ngIf="sectionLoading" class="space-y-8 sm:space-y-10 px-3 sm:px-6 lg:px-8 py-6 sm:py-10 animate-pulse">

    <div *ngFor="let s of skeletonItems" class="space-y-4">

      <p-skeleton width="160px" height="24px">
      </p-skeleton>

      <div class="flex gap-3 sm:gap-5 overflow-x-auto pb-2 scrollbar-hide">

        <div *ngFor="let i of skeletonItems" class="flex-shrink-0 w-40 sm:w-52 md:w-56">

          <div class="p-3 sm:p-4">

            <p-skeleton height="9rem" class="rounded-xl">
            </p-skeleton>

            <div class="mt-3 space-y-2 p-1">
              <p-skeleton width="90%" height="0.9rem"></p-skeleton>
              <p-skeleton width="65%" height="0.9rem"></p-skeleton>
            </div>

          </div>

        </div>

      </div>

    </div>

  </div>



  <div *ngIf="!sectionLoading" class="px-4 sm:px-8 py-10 space-y-16">
    <div *ngFor="let section of productSections" class="space-y-8">
      <div class="flex justify-between items-center pb-3">
        <h3
          class="text-2xl sm:text-3xl font-serif font-semibold text-gray-900 border-l-4 border-teal-400 pl-3 tracking-wide">
          {{ section.title }}
        </h3>
        <button
          class="text-teal-500 hover:text-teal-700 font-medium flex items-center gap-1 text-sm sm:text-base cursor-pointer transition-colors duration-300"
          (click)="navigateSections(section.key)">
          View More <i class="pi pi-angle-right text-xs"></i>
        </button>
      </div>

      <div class="flex overflow-x-auto gap-5 sm:gap-8 pb-2 scrollbar-hide snap-x snap-mandatory scroll-smooth">

        <div *ngFor="let product of section.products" (click)="viewCategoryProduct(product.category._id)"
          class="snap-start flex-shrink-0 w-44 sm:w-56 md:w-60 bg-white rounded-3xl shadow-md hover:shadow-2xl transition-all duration-500 cursor-pointer group relative overflow-hidden border border-gray-100">

          <div class="relative w-full h-48 sm:h-56 flex items-center justify-center ">
            <img
              [src]="product.images[0].startsWith('http') ? product.images[0] : environment.apiUrl + product.images[0] "
              alt="{{ product.name }}"
              class="h-full object-contain transition-transform duration-700 group-hover:scale-110 p-3" />
          </div>

          <span *ngIf="product.discount > 0"
            class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-md">
            {{ product.discount }}% OFF
          </span>

          <div class="p-4 text-center">
            <p
              class="text-sm sm:text-base font-semibold text-gray-800 truncate group-hover:text-teal-600 transition-colors duration-300">
              {{ product.name | titlecase }}
            </p>
            <div class="flex justify-center items-baseline gap-2 mt-1">
              <span class="text-[14px] sm:text-xl font-bold text-teal-500">
                {{ product.price | currency: 'INR'}}
              </span>
              <span *ngIf="product.oldPrice" class="text-[12px] sm:text-base text-gray-400 line-through">
                {{ product.oldPrice | currency: 'INR' }}
              </span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
